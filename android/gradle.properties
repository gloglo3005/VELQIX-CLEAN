# Mémoire réduite — évite le crash du daemon Kotlin
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Daemon désactivé — évite les daemon bloqués sur Windows
org.gradle.daemon=false

# Parallélisme désactivé — stabilise le build
org.gradle.parallel=false
org.gradle.configureondemand=false

# Timeout réseau étendu (en ms) — pour connexion lente
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

android.useAndroidX=true
android.enableJetifier=false
